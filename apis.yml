name: Radical Numerics
description: 'Radical Numerics is an AI research lab building what it calls "general
  biological intelligence" — next-generation AI architectures aimed at biology and
  science rather than language. It was founded by machine-learning researchers Michael
  Poli, Stefano Massaroli, Eric Nguyen, and Armin W. Thomas (associated with the Hyena
  and Evo / Evo 2 genomics model families), with an advisory board including Eric Horvitz,
  Chris Ré, George Church, and Andrew Weber. The lab focuses on the science of scaling,
  architecture, and systems: massive context windows scaling toward one billion tokens,
  generative genomics, biological threat detection, and multimodal biological intelligence.
  Its first product, Omnii, is an early-access health research preview. The company
  announced a $50M seed round in June 2026, with backing including Obvious Ventures.
  As of this profile Radical Numerics publishes no public API, developer portal, or
  SDKs.'
